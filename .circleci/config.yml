version: 2.1

# EXACT ORB VERSIONS ONLY, no @1 / @1.0 / @volatile floats. CircleCI resolves a
# float at config-compile time, so a future orb publish silently changes what
# runs in a pipeline that pushes images to Docker Hub, with zero repo diff and
# zero review. Bumps are a reviewed one-line change here.
orbs:
  slack: circleci/slack@5.1.1
  trivy-scan: arangodb/trivy-scan@1.1.2
  semgrep-scan: arangodb/semgrep-scan@1.0.0
  supply-chain: arangodb/supply-chain@1.0.0

parameters:
  # Runs the deep nightly variant (in-container dependency-tree scan of every
  # image, comprehensive detection, the positive-control self-test and the Slack
  # routing). Set by the "Daily" scheduled pipeline.
  #
  # IT NO LONGER GATES WHETHER IMAGES ARE SCANNED AT ALL. Until this change the
  # only workflow containing an image scan was conditioned on this parameter,
  # which defaults to false, so on every push, every PR, every API trigger and
  # every branch other than the one the schedule names, nothing scanned the
  # images this repository publishes. The image scans now run in the default
  # workflow as well, so a Dockerfile change is scanned before it is merged and
  # coverage no longer depends on a parameter set outside the repository.
  security_scan:
    type: boolean
    default: false
  rebuild_base_images:
    type: boolean
    default: false

  # Structured accepted-risk waivers, subtracted at GATE time only (never passed
  # to trivy as --ignorefile), so the published report, table, JUnit and SBOM
  # keep every finding and only the gate verdict changes.
  waivers-path:
    type: string
    default: .circleci/security-waivers.yaml
  # Maximum expires-minus-detected span per severity. Same table as the POA&M
  # section of SECURITY.md.
  waiver-windows:
    type: string
    default: "critical=30,high=30,medium=90,low=180,design=366,kev=90"
  # Trivy secret-scanner config: re-enables detection inside test trees, which
  # trivy's built-in allow-rules exclude entirely.
  secret-config-path:
    type: string
    default: .circleci/trivy-secret.yaml
  # SAST scope, and the two guards over it. NOTE the two orbs read a parameter of
  # this name with OPPOSITE polarity, which is why there are two of them:
  #   semgrepignore-allowed  = the only entries .semgrepignore MAY contain
  #                            (trivy-scan/disposition-check)
  #   sast-required-paths    = paths that must NOT be excluded from the scan
  #                            (semgrep-scan/scan)
  semgrepignore-allowed:
    type: string
    default: ".git/ node_modules/ __pycache__/ .venv/ venv/ target/ dist/ build/ charts/templates/ baseimages/scripts/entrypoint.sh"
  sast-required-paths:
    type: string
    default: "src/ arango-test-service/ arango-test-service-nodejs/ scripts/ testprojects/"

  # Durable evidence export and Dependency-Track ingest. Both INERT while empty:
  # the steps log why they did nothing and exit 0. No bucket and no
  # Dependency-Track host exist yet (org owner action, recorded in SECURITY.md).
  evidence-bucket:
    type: string
    default: ""
  dtrack-url:
    type: string
    default: ""

# Shared settings for the BLOCKING image gates.
#
# Wide report, narrow gate, ONE scan: severity is the band the gate fails on,
# report-severity the band written to the JSON, table, JUnit and SBOM. This
# replaces the previous two-pass arrangement, where a second report-only
# trivy-scan/scan invocation re-scanned the same image and overwrote the gate's
# results at the orb's fixed output paths. That could not be fixed by reordering
# either: the report pass had to run after the gate, so on a red gate the job
# ended at the gate's fail step and the report pass never ran at all.
#
# scanners is pinned to "vuln" deliberately. Trivy's default scanner set for an
# image includes SECRET detection, so leaving it empty makes a committed or
# vendored key a blocking finding, and the first run of these gates proved why
# that matters: py12cugraph ships tornado's own test fixture key inside the uv
# cache (/home/user/.cache/uv/.../tornado/test/test.key), which turned the gate
# red on a third-party fixture rather than on a vulnerability. Secret detection
# over the images therefore runs as a REPORT-ONLY pass in the same job (see
# build-and-scan-image), which is the same enumerate-then-flip sequence the
# repository secret-scan follows.
x-trivy-image-gate: &image-gate-settings
  scanners: "vuln"
  severity: "CRITICAL,HIGH"
  report-severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
  fail-on-findings: true
  ignore-unfixed: true
  store-junit-results: true
  # Waivers are subtracted from the gate, with the approver and reason logged.
  waivers-path: << pipeline.parameters.waivers-path >>
  waiver-windows: << pipeline.parameters.waiver-windows >>
  # An EOL base OS stops publishing fix data, which combined with ignore-unfixed
  # produces a FALSE-CLEAN result. Armed on a non-reserved exit code.
  exit-on-eol: "1"
  timeout: "45m"

commands:
  build-and-scan-image:
    description: Build image (optional) and scan it with the trivy-scan orb
    parameters:
      image_name:
        type: string
      build_image:
        type: boolean
        default: true
      # "comprehensive" raises recall at the cost of false positives. Set on the
      # nightly instances only: the orb's own guidance is that it does not belong
      # on a blocking PR gate, and the fleet calibration is that PR gates match
      # the industry standard rather than exceed it.
      detection-priority:
        type: string
        default: ""
      scan_timeout:
        type: string
        default: "60m"
    steps:
      - when:
          condition: << parameters.build_image >>
          steps:
            - run:
                name: Build arangodb/<< parameters.image_name >>
                command: |
                  cd baseimages
                  IMAGE="<< parameters.image_name >>"
                  if [ "${IMAGE}" = "py12cugraph" ] || [ "${IMAGE}" = "py12torch" ]; then
                    docker build -f Dockerfile.py12base -t arangodb/py12base .
                  fi
                  docker build -f "Dockerfile.${IMAGE}" -t "arangodb/${IMAGE}" .
                no_output_timeout: << parameters.scan_timeout >>
      # Report-only secret pass over the image filesystem AND the image CONFIG
      # (ENV/ARG/labels), because a build argument that survives into the config
      # is exactly the baked-credential incident class this fleet hit in 2026-07
      # and trivy does not read the config unless asked. Its outputs carry their
      # own prefix, so they cannot overwrite the gate's report, table, JUnit or
      # SBOM, and it runs BEFORE the blocking gate on purpose: a scan placed
      # after a gate does not run at all on a red gate.
      #
      # FLIP CRITERION: report-only until one cycle over all six images has
      # enumerated every fixture and given it a dated allow-rule in
      # .circleci/trivy-secret.yaml (one is already known: tornado's test key in
      # py12cugraph's uv cache). Then set fail-on-findings: true here. Flipping
      # first turns the gate red on third-party fixtures nobody has reviewed.
      - trivy-scan/scan:
          image-ref: arangodb/<< parameters.image_name >>
          scanners: "secret"
          extra-args: "--image-config-scanners secret"
          secret-config-path: << pipeline.parameters.secret-config-path >>
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          fail-on-findings: false
          store-junit-results: true
          output-prefix: "secret-"
          timeout: "45m"
      - trivy-scan/scan:
          <<: *image-gate-settings
          image-ref: arangodb/<< parameters.image_name >>
          detection-priority: << parameters.detection-priority >>
          sbom-output: /tmp/sbom.cdx.json
      - store_artifacts:
          path: /tmp/sbom.cdx.json
          destination: sbom/<< parameters.image_name >>.cdx.json
      # KEV and EPSS correlation over the FULL-severity report the gate just
      # wrote. CISA BOD 26-04 moved the federal baseline off flat CVSS onto these
      # two signals, and trivy reports neither, so a KEV-listed MEDIUM sits below
      # every CVSS-banded gate here and is otherwise never seen. Report-only
      # (fail-on-match false): an exploitation signal on an unfixable base-OS
      # package is triage input, not a reason to block a build nobody can unblock.
      # It annotates; it never fails. On a red gate the job ends before this
      # step, which is deliberate: the gate failure is the actionable signal and
      # the full-band report is stored as an artifact either way.
      - trivy-scan/kev-epss-check:
          report-path: /tmp/trivy-results.json
          fail-on-match: false

jobs:
  build-and-test:
    docker:
      - image: cimg/rust:1.90
    steps:
      - checkout

      # Setup Docker
      - setup_remote_docker:
          docker_layer_caching: true

      # Restore cargo cache
      - restore_cache:
          keys:
            - cargo-{{ checksum "Cargo.lock" }}
            - cargo-

      # Check code compiles
      - run:
          name: Cargo check
          command: cargo check

      # Run clippy linter
      - run:
          name: Cargo clippy
          command: cargo clippy --all-targets --all-features -- -D warnings

      # Build the project in release mode
      - run:
          name: Build project (release mode)
          command: cargo build --release

      # Save cargo cache
      - save_cache:
          paths:
            - /home/circleci/.cargo/registry
            - /home/circleci/.cargo/git
            - target
          key: cargo-{{ checksum "Cargo.lock" }}

      # Install Helm
      - run:
          name: Install Helm
          command: |
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm version

      # Run integration tests. This is also what lints the GENERATED service
      # charts: charts/ in this repository is a template whose Chart.yaml carries
      # {SERVICE_NAME} / {VERSION} placeholders, so it cannot be loaded by helm
      # or by trivy's helm scanner, and servicemaker runs helm lint/package over
      # the rendered chart here instead.
      - run:
          name: Run integration tests
          command: cargo run --release --bin integration_tests -- --no-zip-test

  # Filesystem CVE scan of the checked-out repo. Blocking gate on fixable
  # CRITICAL/HIGH only, which is the industry-standard band, with the full band
  # written to the artifacts so there is evidence of what the gate did not count.
  dependency-cve-scan:
    docker:
      - image: cimg/base:stable
    parameters:
      severity:
        type: string
        default: "CRITICAL,HIGH"
      ignore-unfixed:
        type: boolean
        default: true
      fail-on-findings:
        type: boolean
        default: true
      # Dev/test dependencies are a visibility tier, never a gate: they are not
      # in the shipped images. The nightly instance turns this on.
      extra-args:
        type: string
        default: ""
    steps:
      - checkout
      - trivy-scan/scan:
          scan-type: fs
          scan-path: "."
          # Gate on dependency CVEs only. Committed-secret detection is the
          # separate report-only secret-scan job, so a dev fixture can never
          # block this gate; leaving scanners empty would silently run trivy's
          # default secret scanner here as well.
          scanners: "vuln"
          severity: "<< parameters.severity >>"
          report-severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          ignore-unfixed: << parameters.ignore-unfixed >>
          fail-on-findings: << parameters.fail-on-findings >>
          extra-args: "<< parameters.extra-args >>"
          store-junit-results: true
          waivers-path: << pipeline.parameters.waivers-path >>
          waiver-windows: << pipeline.parameters.waiver-windows >>
          # require-targets is a floor of ONE, so losing two of the three
          # manifests would still leave a target and the gate would pass with two
          # thirds of the dependency surface unscanned. Name them, so a manifest
          # that moves or disappears fails BY NAME. Read off a real run's target
          # list (trivy v0.72.0: 3 language-specific files, 143 SBOM components).
          expect-targets: "Cargo.lock,arango-test-service/requirements.txt,arango-test-service-nodejs/package-lock.json"
          sbom-format: both
          sbom-output: /tmp/sbom.cdx.json
          sbom-spdx-output: /tmp/sbom.spdx.json
      # CISA's 2025 Minimum Elements make tool name, generation context and
      # component identity required fields. min-components is a floor well below
      # the 143 components measured on this tree, so it catches an empty or
      # truncated SBOM without going red on ordinary dependency churn.
      - supply-chain/validate-sbom:
          sbom-path: /tmp/sbom.cdx.json
          min-components: "100"
      - store_artifacts:
          path: /tmp/sbom.cdx.json
          destination: sbom/dependency-cve-scan.cdx.json
      - store_artifacts:
          path: /tmp/sbom.spdx.json
          destination: sbom/dependency-cve-scan.spdx.json
      # Durable evidence export (AU-11, CA-7) and continuous re-analysis of the
      # component inventory (RV.1.2). Both INERT while the parameters are empty.
      - supply-chain/publish-evidence:
          s3-bucket: << pipeline.parameters.evidence-bucket >>
          subject: "${CIRCLE_SHA1}"
          project: "servicemaker-dependency-gate"
          report-json: /tmp/trivy-results.json
          report-table: /tmp/trivy-results.txt
          sbom-cyclonedx: /tmp/sbom.cdx.json
          sbom-spdx: /tmp/sbom.spdx.json
          scanner-provenance: /tmp/trivy-scanner-provenance.json
      - supply-chain/dtrack-upload:
          dtrack-url: << pipeline.parameters.dtrack-url >>
          sbom-path: /tmp/sbom.cdx.json
          project-name: "servicemaker"
          project-version: "${CIRCLE_BRANCH:-${CIRCLE_TAG}}"

  # Report-only repository secret scan.
  #
  # FLIP CRITERION (do not skip it): this stays report-only for ONE cycle with
  # .circleci/trivy-secret.yaml in place, so any real fixture is enumerated and
  # given a dated allow-rule first. Then set fail-on-findings: true, add
  # secret-scan to .github/required-checks.txt and to the image jobs' requires:
  # chains. Flipping first turns the gate red on fixtures nobody has reviewed,
  # which is how a gate gets switched off permanently. Starting point: one clean
  # local run on trivy v0.72.0 with the built-in tests allow-rule disabled.
  secret-scan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - trivy-scan/scan:
          scan-type: fs
          scan-path: "."
          scanners: "secret"
          secret-config-path: << pipeline.parameters.secret-config-path >>
          # Report-only, so widening the band costs the gate nothing while
          # surfacing the MEDIUM/LOW secret rules the CRITICAL,HIGH default
          # hides entirely.
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          fail-on-findings: false
          store-junit-results: true

  # Gating IaC/config scan over the Dockerfiles this repository ships and the
  # Dockerfile templates servicemaker renders into generated services.
  #
  # NO helm-lint and no helm misconfig coverage here, deliberately: charts/ is a
  # TEMPLATE (name: {SERVICE_NAME}, version: {VERSION}), so helm cannot load it
  # and trivy's helm scanner reads zero files from it. helm lint would fail on
  # the placeholders, and a misconfig gate that silently scans zero Helm files is
  # worse than none. The rendered chart is linted by servicemaker itself inside
  # the integration test.
  misconfig-scan:
    docker:
      - image: cimg/base:stable
    parameters:
      # Commit-time gate stays CRITICAL,HIGH. The nightly instance widens to
      # MEDIUM report-only, which surfaces the unpinned-base-image and
      # missing-healthcheck band without gating on it.
      severity:
        type: string
        default: "CRITICAL,HIGH"
      fail-on-findings:
        type: boolean
        default: true
    steps:
      - checkout
      - trivy-scan/scan:
          scan-type: fs
          scan-path: "."
          scanners: "misconfig"
          severity: "<< parameters.severity >>"
          fail-on-findings: << parameters.fail-on-findings >>
          store-junit-results: true
          waivers-path: << pipeline.parameters.waivers-path >>
          waiver-windows: << pipeline.parameters.waiver-windows >>
          # Trivy's dockerfile analyzer does not recognise
          # Dockerfile.nodejs.template (measured on v0.72.0: it detects
          # Dockerfile.template and every baseimages/Dockerfile.* and skips that
          # one), so the Node.js service template was silently unscanned.
          # First-class parameter, NOT extra-args: extra-args goes through shell
          # word splitting and quote removal, so a regex written there is not the
          # regex trivy receives.
          file-patterns: 'dockerfile:Dockerfile\.nodejs\.template'
      # Deterministic final-stage build-credential guard. Covers a class trivy
      # structurally cannot: its secret rules match token PATTERNS, so a generic
      # registry password matches nothing at all.
      - trivy-scan/dockerfile-credential-guard:
          dockerfiles: "Dockerfile.template Dockerfile.nodejs.template baseimages/Dockerfile.py12base baseimages/Dockerfile.py12cugraph baseimages/Dockerfile.py12torch baseimages/Dockerfile.node22base"

  # TIER 1 of two: gating SAST over first-party code (the Rust CLI, the two
  # reference services, the shell and JS helper scripts), full repo,
  # high-confidence rules only. Semgrep CE from PyPI; the paid AppSec Platform is
  # deliberately not wired and there is no SEMGREP_APP_TOKEN.
  sast-scan:
    executor: semgrep-scan/default
    steps:
      - checkout
      - semgrep-scan/scan:
          # p/rust is added because p/default carries almost no Rust rules, and
          # src/main.rs plus src/bin/integration_tests.rs are the largest piece
          # of first-party code here.
          rulesets: "p/default p/rust"
          # GATE at ERROR. severity stays at the orb's INFO default, so the JSON,
          # SARIF and JUnit carry the whole band while only ERROR fails the job.
          fail-on-severity: ERROR
          # Semgrep's built-in ignore list drops test/, tests/, build/ and dist/
          # wholesale. testprojects/ is fixture code that ships in this
          # repository and is rendered into generated services, so it stays in
          # scope; the committed .semgrepignore replaces the built-in list.
          scan-tests: true
          semgrepignore-baseline: << pipeline.parameters.sast-required-paths >>
          sarif-output: /tmp/semgrep.sarif

  # TIER 2 of two: diff-aware SAST. The full-repo gate above runs ERROR only,
  # which leaves semgrep's largest band unused, and p/rust ships no ERROR rules
  # at all, so without this tier the Rust code is effectively ungated. This
  # blocks on NEWLY INTRODUCED findings at WARNING without a backlog-clearing
  # project first (measured on this branch: 3 WARNING findings, all pre-existing
  # on main, so the diff tier starts green).
  sast-scan-diff:
    executor: semgrep-scan/default
    steps:
      - checkout
      - semgrep-scan/scan:
          rulesets: "p/default p/rust"
          baseline-commit: main
          fail-on-severity: WARNING
          scan-tests: true
          semgrepignore-baseline: << pipeline.parameters.sast-required-paths >>
          # Distinct prefix so this job's report does not collide with
          # sast-scan's in the Artifacts and Tests tabs.
          output-prefix: semgrep-diff

  # The enforcement mechanism behind the whole exception path: no accepted risk
  # without a date, an owner and a window. Blocking, and deliberately so - this
  # is not gate strictness, it is whether the exception path can be trusted at
  # all. A missing or malformed waivers file fails rather than being read as an
  # empty waiver set, so deleting the file cannot silently widen every gate.
  disposition-check:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - trivy-scan/disposition-check:
          # No .trivyignore in this repository: dispositions live in the
          # structured waivers file. The paths are still listed, because a
          # missing file is skipped and a reintroduced one is then parsed and
          # dated instead of quietly suppressing findings.
          ignorefiles: ".trivyignore.yaml,.trivyignore.yml,.trivyignore"
          secret-config-path: << pipeline.parameters.secret-config-path >>
          # ALLOWED exclusion set (opposite polarity to the semgrep orb's
          # parameter of the same name): any active .semgrepignore entry beyond
          # this list fails the job, so SAST scope cannot be narrowed without a
          # reviewed change here.
          semgrepignore-baseline: << pipeline.parameters.semgrepignore-allowed >>
          poam-windows: "critical=30,high=30,medium=90,low=180"
      # Waiver integrity: schema, scope, dates, windows, and an approved-by that
      # has to resolve to a CODEOWNERS entry.
      - trivy-scan/validate-waivers:
          waivers-path: << pipeline.parameters.waivers-path >>
          waiver-windows: << pipeline.parameters.waiver-windows >>

  # Drift control on the required-status-check configuration itself. A job rename
  # or a workflow-count change silently renumbers CircleCI's instance suffixes,
  # which either blocks every merge forever or leaves a required check pointing at
  # a context nobody emits, so it protects nothing.
  #
  # WARN-ONLY, and today it can only report the starting position: this
  # repository has NO ruleset with required status checks (only the two
  # enterprise force-push/delete rulesets), so every gate here gates pipeline
  # progression and none of them blocks a merge yet. Creating that ruleset is an
  # owner action; flip the two exit 0 lines below to exit 1 in the same change.
  required-checks-drift:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Compare the live rulesets against .github/required-checks.txt
          command: |
            set -eu
            LIST=".github/required-checks.txt"
            if [ ! -s "${LIST}" ]; then
              echo "WARNING: ${LIST} is missing or empty, so there is no committed list to compare against. Commit it." >&2
              exit 0
            fi
            grep -vE '^[[:space:]]*(#|$)' "${LIST}" \
              | sed -e 's/[[:space:]]*$//' | sort -u > /tmp/required-expected.txt
            echo "Committed required contexts (${LIST}):"
            sed -e 's/^/  /' /tmp/required-expected.txt
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "WARNING: GITHUB_TOKEN is not in the environment, so the live rulesets could not be read and drift is UNVERIFIED on this run. Attach a context carrying a read-only token with repository administration:read." >&2
              exit 0
            fi
            API="https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            if ! curl -sSfL --retry 3 --retry-delay 2 --max-time 60 \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -o /tmp/rulesets.json "${API}/rulesets"; then
              echo "WARNING: could not list rulesets, drift is UNVERIFIED on this run." >&2
              exit 0
            fi
            # grep/sed rather than a heredoc-fed interpreter: CircleCI reserves a
            # literal double-less-than for parameter interpolation, so a heredoc
            # operator in a command body is a standing edit hazard.
            : > /tmp/required-live.txt
            for id in $(grep -oE '"id":[[:space:]]*[0-9]+' /tmp/rulesets.json | grep -oE '[0-9]+'); do
              if curl -sSfL --max-time 60 \
                    -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -o "/tmp/ruleset-${id}.json" "${API}/rulesets/${id}"; then
                grep -oE '"context":[[:space:]]*"[^"]*"' "/tmp/ruleset-${id}.json" \
                  | sed -e 's/.*"\([^"]*\)"$/\1/' >> /tmp/required-live.txt || true
              fi
            done
            sort -u /tmp/required-live.txt -o /tmp/required-live.txt
            echo "Live required contexts across all rulesets:"
            sed -e 's/^/  /' /tmp/required-live.txt
            MISSING="$(comm -23 /tmp/required-expected.txt /tmp/required-live.txt)"
            EXTRA="$(comm -13 /tmp/required-expected.txt /tmp/required-live.txt)"
            if [ -z "${MISSING}" ] && [ -z "${EXTRA}" ]; then
              echo "Rulesets match the committed list."
              exit 0
            fi
            if [ -n "${MISSING}" ]; then
              echo "DRIFT: committed but NOT required by any ruleset, so these gates do not block a merge:" >&2
              printf '%s\n' "${MISSING}" | sed -e 's/^/  /' >&2
            fi
            if [ -n "${EXTRA}" ]; then
              echo "DRIFT: required by a ruleset but NOT in the committed list. A required context that no job emits is fail-closed and blocks every merge; one that matches the wrong job silently drops the intended gate:" >&2
              printf '%s\n' "${EXTRA}" | sed -e 's/^/  /' >&2
            fi
            echo "WARN-ONLY until a ruleset lists the gate contexts. See the flip note in .circleci/config.yml." >&2
            exit 0

  # A gate that has never failed is indistinguishable from no gate. This runs the
  # SAME configuration the blocking image gates run, against a pinned
  # known-vulnerable image, and fails when detection has stopped working, so a
  # broken scanner install, a doctored DB cache or a bad severity filter cannot
  # leave every other gate passing vacuously.
  nightly-self-test:
    docker:
      - image: cimg/base:stable
        user: root
    steps:
      - trivy-scan/scan:
          # python:3.9-slim, pinned by digest so the fixture cannot drift. NOT an
          # EOL tag: an EOL distro stops publishing fix data, which is exactly
          # the weak signal this control must not depend on.
          image-ref: "python:3.9-slim@sha256:2d97f6910b16bd338d3060f261f53f144965f755599aab1acda1e13cf1731b1b"
          image-src: remote
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          # false, so the assertion below owns the verdict: the orb has no
          # expect-failure mode and a red scan here would read as a pass.
          fail-on-findings: false
          output-prefix: "selftest-"
          store-junit-results: false
      - run:
          name: Assert the positive control detected findings
          command: |
            set -eu
            REPORT="/tmp/selftest-trivy-results.json"
            FLOOR=5
            if [ ! -s "${REPORT}" ]; then
              echo "ERROR: the positive control produced no report at ${REPORT}, so the scan machinery did not run. This is a broken gate, not a clean image." >&2
              exit 1
            fi
            COUNT="$(grep -oE '"VulnerabilityID":[[:space:]]*"[^"]+"' "${REPORT}" | sort -u | wc -l | tr -d ' ')"
            echo "Positive control: ${COUNT} unique fixable CRITICAL/HIGH id(s) in the pinned fixture image (floor ${FLOOR})."
            if [ "${COUNT}" -lt "${FLOOR}" ]; then
              echo "ERROR: the pinned known-vulnerable fixture came back with ${COUNT} findings, below the floor of ${FLOOR}. The vulnerability database, the scanner install or the severity filter is broken, so every OTHER gate in this pipeline is currently passing vacuously. Do not disposition this; fix the scanner." >&2
              exit 1
            fi
            echo "Detection is proven for this configuration on this run."
      - store_artifacts:
          path: /tmp/selftest-trivy-results.json
          destination: selftest-trivy-results.json

  security-scan:
    parameters:
      image_name:
        type: string
      build_image:
        type: boolean
        default: true
      detection-priority:
        type: string
        default: ""
      # The legacy in-container pass: copies the dependency tree out of the image
      # and fs-scans it, which reaches packages the image analyzers do not
      # attribute. Nightly only, since it duplicates most of the image gate's
      # coverage at PR time.
      in-container-scan:
        type: boolean
        default: false
    docker:
      # root required: trivy-scan orb installs the binary to /usr/local/bin
      - image: cimg/base:stable
        user: root
    steps:
      - checkout

      # Setup Docker
      - setup_remote_docker:
          docker_layer_caching: true
      - build-and-scan-image:
          image_name: << parameters.image_name >>
          build_image: << parameters.build_image >>
          detection-priority: << parameters.detection-priority >>
      - when:
          condition: << parameters.in-container-scan >>
          steps:
            - run:
                name: In-container scan arangodb/<< parameters.image_name >>
                command: |
                  chmod +x baseimages/scan_security.sh
                  SCAN_SINGLE_IMAGE=<< parameters.image_name >> IN_CONTAINER_ONLY=1 baseimages/scan_security.sh
                no_output_timeout: 30m

  security-scan-notify:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Check security scan results
          command: |
            if [ -z "${CIRCLECI_TOKEN:-}" ]; then
              echo "ERROR: CIRCLECI_TOKEN is not set (add circleci-token context to security-scan-notify)" >&2
              exit 1
            fi
            # Every job whose failure means the nightly found something, or that
            # the scanning machinery itself is broken. Keep this list in step
            # with the nightly workflow's job names.
            SCAN_JOBS="py12base-nightly py12cugraph-nightly py12torch-nightly node22base-nightly test-service-nightly test-service-nodejs-nightly dependency-cve-scan-nightly disposition-check-nightly nightly-self-test"
            API_URL="https://circleci.com/api/v2/workflow/${CIRCLE_WORKFLOW_ID}/job"
            RESPONSE=$(curl -sf -H "Circle-Token: ${CIRCLECI_TOKEN}" "${API_URL}")
            FAILED_JOBS=""
            for job in ${SCAN_JOBS}; do
              STATUS=$(echo "${RESPONSE}" | jq -r --arg n "${job}" '.items[] | select(.name == $n) | .status' | head -1)
              if [ "${STATUS}" = "failed" ] || [ "${STATUS}" = "canceled" ]; then
                FAILED_JOBS="${FAILED_JOBS} ${job}"
              fi
            done
            if [ -n "${FAILED_JOBS}" ]; then
              echo "Security scan failed for:${FAILED_JOBS}"
              echo "Workflow: ${CIRCLE_WORKFLOW_URL}"
              exit 1
            fi
            echo "All security scan jobs passed."
      - slack/notify:
          event: fail
          mentions: '@neunhoef'
          channel: 'baseimagesecurityscan'
          template: basic_fail_1

  rebuild-base-images:
    docker:
      - image: cimg/rust:1.90
    steps:
      - checkout

      # Setup Docker
      - setup_remote_docker:
          docker_layer_caching: true

      # Login to Docker Hub
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin

      # Build base images
      - run:
          name: Build base images
          command: |
            cd baseimages
            make build
          no_output_timeout: 60m

      # Gate the push on the SAME policy as the PR-time and nightly image scans:
      # these images previously shipped to Docker Hub with no scan between the
      # build and the next scheduled run. Scanning the freshly built local images
      # here, before push, closes that window instead of relying on post-hoc
      # detection. output-prefix keeps the four scans from overwriting each
      # other's report, table, JUnit and SBOM at the orb's fixed output paths.
      - trivy-scan/scan:
          <<: *image-gate-settings
          image-ref: arangodb/py12base
          output-prefix: "py12base-"
          sbom-output: /tmp/sbom-py12base.cdx.json
      - store_artifacts:
          path: /tmp/sbom-py12base.cdx.json
          destination: sbom/py12base.cdx.json
      - trivy-scan/scan:
          <<: *image-gate-settings
          image-ref: arangodb/py12cugraph
          output-prefix: "py12cugraph-"
          sbom-output: /tmp/sbom-py12cugraph.cdx.json
      - store_artifacts:
          path: /tmp/sbom-py12cugraph.cdx.json
          destination: sbom/py12cugraph.cdx.json
      - trivy-scan/scan:
          <<: *image-gate-settings
          image-ref: arangodb/py12torch
          output-prefix: "py12torch-"
          sbom-output: /tmp/sbom-py12torch.cdx.json
      - store_artifacts:
          path: /tmp/sbom-py12torch.cdx.json
          destination: sbom/py12torch.cdx.json
      - trivy-scan/scan:
          <<: *image-gate-settings
          image-ref: arangodb/node22base
          output-prefix: "node22base-"
          sbom-output: /tmp/sbom-node22base.cdx.json
      - store_artifacts:
          path: /tmp/sbom-node22base.cdx.json
          destination: sbom/node22base.cdx.json

      # Push base images
      - run:
          name: Push base images to Docker Hub
          command: |
            cd baseimages
            make push

      - run:
          name: Install Helm
          command: |
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm version

      # Build and push test-service images (servicemaker runs helm lint/package)
      - run:
          name: Build and push test-service images
          command: |
            cargo build --release
            make test-service test-service-nodejs
          no_output_timeout: 60m

workflows:
  version: 2

  # Default workflow: every pipeline that is not a base-image rebuild and not the
  # deep nightly. This is where the gates live, INCLUDING the image scans, which
  # used to run only when an externally-set parameter happened to be true.
  build-and-test:
    when:
      and:
        - equal: [false, << pipeline.parameters.security_scan >>]
        - equal: [false, << pipeline.parameters.rebuild_base_images >>]
    jobs:
      - build-and-test:
          filters:
            branches:
              ignore: []  # Run on all branches
      - dependency-cve-scan
      - secret-scan
      - misconfig-scan
      - sast-scan
      - sast-scan-diff
      - disposition-check
      - required-checks-drift
      # Image scans on every pipeline. Names are explicit so a future topology
      # change cannot renumber the status-check contexts: CircleCI appends an
      # instance suffix when a job name appears in more than one workflow, and
      # the scheme is not predictable.
      - security-scan:
          name: py12base
          image_name: py12base
          build_image: true
      - security-scan:
          name: py12cugraph
          image_name: py12cugraph
          build_image: true
      - security-scan:
          name: py12torch
          image_name: py12torch
          build_image: true
      - security-scan:
          name: node22base
          image_name: node22base
          build_image: true
      - security-scan:
          name: test-service
          image_name: test-service
          build_image: false
      - security-scan:
          name: test-service-nodejs
          image_name: test-service-nodejs
          build_image: false

  # Deep nightly, driven by the "Daily" scheduled pipeline (security_scan: true).
  # Adds the in-container dependency-tree pass, comprehensive detection, the
  # full-severity dependency report including dev dependencies, the date-driven
  # disposition expiry check (which has to fire without a push), the
  # positive-control self-test and the Slack routing.
  security-scan-nightly:
    when: << pipeline.parameters.security_scan >>
    jobs:
      - security-scan:
          name: py12base-nightly
          image_name: py12base
          build_image: true
          detection-priority: comprehensive
          in-container-scan: true
      - security-scan:
          name: py12cugraph-nightly
          image_name: py12cugraph
          build_image: true
          detection-priority: comprehensive
          in-container-scan: true
      - security-scan:
          name: py12torch-nightly
          image_name: py12torch
          build_image: true
          detection-priority: comprehensive
          in-container-scan: true
      - security-scan:
          name: node22base-nightly
          image_name: node22base
          build_image: true
          detection-priority: comprehensive
          in-container-scan: true
      - security-scan:
          name: test-service-nightly
          image_name: test-service
          build_image: false
          detection-priority: comprehensive
          in-container-scan: true
      - security-scan:
          name: test-service-nodejs-nightly
          image_name: test-service-nodejs
          build_image: false
          detection-priority: comprehensive
          in-container-scan: true
      # Report tier: the full severity band, unfixed findings included and dev
      # dependencies in scope. Never blocks, so an unfixed LOW cannot leave the
      # nightly permanently red; the commit-time gate keeps its fixable
      # CRITICAL/HIGH band.
      - dependency-cve-scan:
          name: dependency-cve-scan-nightly
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          ignore-unfixed: false
          fail-on-findings: false
          extra-args: "--include-dev-deps"
      - misconfig-scan:
          name: misconfig-scan-nightly
          severity: "CRITICAL,HIGH,MEDIUM"
          fail-on-findings: false
      # Expiry is date-driven, so it has to run without a push.
      - disposition-check:
          name: disposition-check-nightly
      - nightly-self-test
      - security-scan-notify:
          context:
            - slack-secrets
            - circleci-token
          # terminal = run after each scan finishes (success or failure)
          requires:
            - py12base-nightly: terminal
            - py12cugraph-nightly: terminal
            - py12torch-nightly: terminal
            - node22base-nightly: terminal
            - test-service-nightly: terminal
            - test-service-nodejs-nightly: terminal
            - dependency-cve-scan-nightly: terminal
            - disposition-check-nightly: terminal
            - nightly-self-test: terminal

  # Manual base-image rebuild. The gates now sit in front of the job that pushes
  # to Docker Hub, so a repository whose waivers have expired, whose Dockerfiles
  # carry a CRITICAL/HIGH misconfiguration or whose dependency manifests carry a
  # fixable CRITICAL/HIGH CVE cannot publish an image.
  rebuild-base-images-manual:
    when: << pipeline.parameters.rebuild_base_images >>
    jobs:
      - dependency-cve-scan:
          name: dependency-cve-scan-rebuild
      - misconfig-scan:
          name: misconfig-scan-rebuild
      - disposition-check:
          name: disposition-check-rebuild
      - rebuild-base-images:
          context: docker-hub
          requires:
            - dependency-cve-scan-rebuild
            - misconfig-scan-rebuild
            - disposition-check-rebuild
