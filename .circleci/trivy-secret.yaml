# Trivy secret-scanner configuration for this repository.
# Passed as `secret-config-path` to the repository secret scan and to every
# image gate, so the same rule set applies to the checkout and to the images.
#
# WHY THIS FILE EXISTS
# Trivy ships built-in ALLOW rules, and one of them ("tests") suppresses every
# finding whose path looks like test code: measured on trivy v0.72.0, one
# identical 40-character token is detected in src/ and docs/ and NOT in tests/,
# test/, testdata/, test_*.py or *_test.go. Every baked-credential incident in
# this fleet lived in exactly that tree. This repository ships two reference
# services and four testprojects/ fixtures that are rendered into generated
# services, so that tree is exactly where a copied credential would land.
#
# GATE STATUS: secret-scan is REPORT-ONLY (fail-on-findings false, severity
# CRITICAL,HIGH,MEDIUM,LOW). The flip to blocking happens after one report-only
# cycle on main: read the job's findings, add a dated allow-rule below for each
# genuine fixture, then set fail-on-findings true, add the job to
# .github/required-checks.txt and to the image jobs' requires: chains. Flipping
# before that cycle turns the gate red on fixtures nobody has reviewed, which is
# how a gate gets switched off for good. Starting point: one clean local run on
# trivy v0.72.0 over this tree with the tests allow-rule disabled, 0 findings.

# Re-review the decision to keep test and fixture code in secret scope on the
# annual control review. review by: 2027-07-29
disable-allow-rules:
  # Built-in allow rule that excludes tests/, test/, testdata/, *_test.* and
  # test_*.* from secret detection entirely.
  - tests

# Dated allow-rules for genuine, non-live fixtures. Each needs a
# `review by: YYYY-MM-DD` date; disposition-check fails the build once a date
# passes.
allow-rules:
  # Tornado's own test fixture private key, which ships inside py12cugraph
  # because prepareuv.sh leaves the uv archive cache in the image:
  # /home/user/.cache/uv/archive-v0/<hash>/tornado/test/test.key (observed in
  # build 1101, HIGH AsymmetricPrivateKey). Third-party fixture, not a
  # credential of ours, so it is allowed rather than gated. The real fix is not
  # shipping the uv cache at all, which is a change to prepareuv.sh and a
  # separate call. review by: 2026-10-27
  - id: tornado-test-fixture-key
    description: tornado test fixture private key left in the uv archive cache inside py12cugraph
    path: .*\.cache/uv/.*/tornado/test/test\.key

# Shape for further entries:
#
#   # Deterministic non-live token used only by a generated-service fixture.
#   # review by: 2027-07-29
#   - id: fixture-token
#     description: static non-live token in a testprojects fixture
#     path: testprojects/.*/config\.json
