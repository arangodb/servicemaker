# Trivy secret-scanner config, passed as secret-config-path to the repository
# scan and to every image gate.
#
# Trivy's built-in "tests" allow-rule suppresses every finding whose path looks
# like test code. Measured on v0.72.0: one identical 40-char token is detected
# in src/ and docs/, not in tests/, testdata/ or *_test.go. Every
# baked-credential incident in this fleet lived in exactly that tree, and this
# repo's testprojects/ fixtures are rendered into generated services.
#
# secret-scan is REPORT-ONLY until every genuine fixture has a dated allow-rule
# below; starting point is one clean local run with the tests rule disabled.

# Re-review keeping test and fixture code in scope. review by: 2027-07-29
disable-allow-rules:
  # Built-in rule excluding tests/, testdata/ and *_test.* from detection.
  - tests

# Genuine non-live fixtures. Each needs a `review by: YYYY-MM-DD`;
# disposition-check fails the build once the date passes.
allow-rules:
  # Third-party fixture, not a credential of ours: it ships in py12cugraph only
  # because prepareuv.sh leaves the uv archive cache in the image (observed in
  # build 1101). The real fix is not shipping that cache, a separate call on
  # prepareuv.sh. review by: 2026-10-27
  - id: tornado-test-fixture-key
    description: tornado test fixture private key left in the uv archive cache inside py12cugraph
    path: .*\.cache/uv/.*/tornado/test/test\.key

# Shape for further entries:
#   - id: fixture-token
#     description: static non-live token in a testprojects fixture
#     path: testprojects/.*/config\.json
#     # review by: 2027-07-29
